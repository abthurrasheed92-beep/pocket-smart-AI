{% extends "base.html" %}

{% block title %}
Login - PocketSmart AI
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo">💡</div>

            <h1>Welcome Back</h1>

            <p>
                Login to continue using PocketSmart AI.
            </p>
        </div>

        <div
            id="login-message"
            class="message hidden"
        ></div>

        <form
            id="login-form"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary btn-full"
                id="login-button"
            >
                Login
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="/register">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</section>

<script>

document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const message =
                document.getElementById(
                    "login-message"
                );

            const button =
                document.getElementById(
                    "login-button"
                );

            const data = {
                email:
                    document
                        .getElementById("email")
                        .value,

                password:
                    document
                        .getElementById("password")
                        .value
            };

            button.disabled = true;
            button.textContent =
                "Logging in...";

            try {

                const response =
                    await fetch(
                        "/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify(data)
                        }
                    );

                const result =
                    await response.json();

                if (response.ok) {

                    localStorage.setItem(
                        "access_token",
                        result.access_token
                    );

                    message.classList.remove(
                        "hidden"
                    );

                    message.innerHTML =
                        "<p>Login successful!</p>";

                    setTimeout(
                        function () {
                            window.location.href =
                                "/dashboard";
                        },
                        500
                    );

                } else {

                    message.classList.remove(
                        "hidden"
                    );

                    message.innerHTML =
                        "<p>" +
                        (
                            result.detail ||
                            "Login failed"
                        ) +
                        "</p>";
                }

            } catch (error) {

                message.classList.remove(
                    "hidden"
                );

                message.innerHTML =
                    "<p>Something went wrong. Please try again.</p>";

            } finally {

                button.disabled = false;

                button.textContent =
                    "Login";
            }
        }
    );

</script>

{% endblock %}
