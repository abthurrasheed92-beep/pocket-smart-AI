{% extends "base.html" %}

{% block title %}Register - PocketSmart AI{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p>Register to use PocketSmart AI</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Register
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <div id="registerMessage"></div>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("registerMessage");

    const data = {
        name: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            message.innerHTML = "<p>Registration successful! Please login.</p>";
            setTimeout(() => {
                window.location.href = "/login";
            }, 1000);
        } else {
            message.innerHTML =
                "<p>" + (result.detail || "Registration failed") + "</p>";
        }

    } catch (error) {
        message.innerHTML = "<p>Something went wrong. Please try again.</p>";
    }
});
</script>

{% endblock %}
